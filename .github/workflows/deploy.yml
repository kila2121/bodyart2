name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create config.ini from secrets
        run: |
          echo "[database]" > config.ini
          echo "host = \"${{ secrets.DB_HOST }}\"" >> config.ini
          echo "base = \"${{ secrets.DB_NAME }}\"" >> config.ini
          echo "user = \"${{ secrets.DB_USER }}\"" >> config.ini
          echo "pass = \"${{ secrets.DB_PASS }}\"" >> config.ini

      - name: Deploy via SSH
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" scp -o StrictHostKeyChecking=no config.ini root@${{ secrets.SERVER_HOST }}:/var/www/bodyart/config.ini
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no root@${{ secrets.SERVER_HOST }} "
            cd /var/www/bodyart
            
            # Сохраняем uploads если есть
            if [ -d public/uploads ]; then
              mv public/uploads /tmp/uploads_backup
            fi
            
            git fetch origin
            git reset --hard origin/main
            
            # Восстанавливаем uploads
            if [ -d /tmp/uploads_backup ]; then
              mv /tmp/uploads_backup public/uploads
            fi
            
            mkdir -p cache
            chown www-data:www-data cache
            chmod 755 cache
            chown -R www-data:www-data .
            chmod -R 755 .
            systemctl reload apache2
          "
