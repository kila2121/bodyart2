name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create config.ini from secrets
        run: |
          echo "[database]" > config.ini
          echo "host = \"${{ secrets.DB_HOST }}\"" >> config.ini
          echo "base = \"${{ secrets.DB_NAME }}\"" >> config.ini
          echo "user = \"${{ secrets.DB_USER }}\"" >> config.ini
          echo "pass = \"${{ secrets.DB_PASS }}\"" >> config.ini

      - name: Deploy via SSH
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem
          ssh -o StrictHostKeyChecking=no -i key.pem root@${{ secrets.SERVER_HOST }} "
            cd /var/www/bodyart
            git pull origin main
            chown -R www-data:www-data .
            chmod -R 755 .
            systemctl reload apache2
          "
