name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create config.ini from secrets
        run: |
          echo "[database]" > config.ini
          echo "host = \"${{ secrets.DB_HOST }}\"" >> config.ini
          echo "base = \"${{ secrets.DB_NAME }}\"" >> config.ini
          echo "user = \"${{ secrets.DB_USER }}\"" >> config.ini
          echo "pass = \"${{ secrets.DB_PASS }}\"" >> config.ini

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/bodyart
            git pull origin main
            chown -R www-data:www-data .
            chmod -R 755 .
            systemctl reload apache2
