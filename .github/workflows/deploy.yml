name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create config.ini from secrets
        run: |
          echo "[database]" > config.ini
          echo "host = \"${{ secrets.DB_HOST }}\"" >> config.ini
          echo "base = \"${{ secrets.DB_NAME }}\"" >> config.ini
          echo "user = \"${{ secrets.DB_USER }}\"" >> config.ini
          echo "pass = \"${{ secrets.DB_PASS }}\"" >> config.ini

      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 166.88.130.15 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_HOST }} "
            cd /var/www/bodyart
            git pull origin main
            chown -R www-data:www-data .
            chmod -R 755 .
            systemctl reload apache2
          "
